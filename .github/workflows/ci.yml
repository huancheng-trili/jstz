name: Continuous Integration

on:
  pull_request:
  merge_group:
  push:
    branches: [huanchengchang/jstz-932-test]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  run:
    uses: huancheng-trili/jstz/.github/workflows/sdk-npm.yml@huanchengchang/jstz-932-test
    with:
      ref: v1.0.1
      dry_run: false
    secrets: inherit
